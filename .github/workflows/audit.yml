name: Repo Audit

on:
    pull_request:
    push:
        branches:
            - main

jobs:
    docs-audit:
        name: docs-audit
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Spec coverage matrix check
              run: python3 scripts/check_spec_coverage_matrix.py

    backend-audit:
        name: backend-audit
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Repo secrets scan
              run: python ../scripts/repo_secrets_scan.py --mode working-tree

            - name: Repo history scan (advisory)
              run: python ../scripts/repo_secrets_scan.py --mode history --allow-history-findings

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: |
                      backend/pyproject.toml
                      backend/requirements.txt
                      backend/requirements-dev.in
                      backend/requirements-dev.txt

            - name: Install backend lock tooling
              run: python -m pip install --upgrade pip pip-tools

            - name: Verify backend lockfiles
              run: ../scripts/check_backend_requirements.sh

            - name: Install backend dependencies with integrity verification
              run: ../scripts/verify_backend_dependency_integrity.sh

            - name: Generate backend SBOM
              run: ../scripts/generate_sbom.sh backend

            - name: Upload backend SBOM
              uses: actions/upload-artifact@v4
              with:
                  name: backend-sbom
                  path: artifacts/sbom/backend.cyclonedx.json

            - name: Ruff lint
              run: ruff check .
              continue-on-error: true

            - name: Ruff format check
              run: ruff format . --check
              continue-on-error: true

            - name: Pyright
              run: pyright .
              continue-on-error: true

            - name: Migration and drift tests
              run: pytest tests/test_database_migrations.py -q

            - name: Pytest
              run: pytest
              continue-on-error: true

            - name: Vulture dead-code scan
              run: vulture app tests --min-confidence 80
              continue-on-error: true

            - name: Bandit security scan
              run: bandit -r app
              continue-on-error: true

            - name: Python dependency audit
              run: pip-audit -r requirements-hashed.txt --require-hashes

    frontend-audit:
        name: frontend-audit
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install frontend dependencies
              run: npm ci

            - name: Frontend dependency checks
              run: ../scripts/check_frontend_dependencies.sh

            - name: Generate frontend SBOM
              run: ../scripts/generate_sbom.sh frontend

            - name: Upload frontend SBOM
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-sbom
                  path: artifacts/sbom/frontend.cyclonedx.json

            - name: ESLint
              run: npm run lint
              continue-on-error: true

            - name: TypeScript
              run: npm run typecheck
              continue-on-error: true

            - name: Dependency cruiser architecture scan
              run: npm run audit:arch
              continue-on-error: true
