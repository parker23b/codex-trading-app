repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: spec-coverage-matrix
        name: spec coverage matrix
        entry: python3 scripts/check_spec_coverage_matrix.py
        language: system
        pass_filenames: false
        files: ^(docs/spec/.*\.md|docs/audit-status\.md|scripts/check_spec_coverage_matrix\.py)$
        stages: [pre-push]

      - id: repo-secrets-scan
        name: repo secrets scan
        entry: python3 scripts/repo_secrets_scan.py --mode staged
        language: system
        pass_filenames: false

      - id: backend-tests
        name: backend tests
        entry: bash -c 'cd backend && .venv/bin/python -m pytest -q'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: backend-route-inventory
        name: backend route inventory
        entry: bash -c 'cd backend && .venv/bin/python ../scripts/check_backend_route_inventory.py'
        language: system
        pass_filenames: false
        files: ^(backend/app/api/|backend/tests/test_route_inventory_guard\.py|frontend/lib/api\.ts|docs/backend-api-routes\.md|scripts/check_backend_route_inventory\.py)$
        stages: [pre-push]

      - id: backend-migration-tests
        name: backend migration tests
        entry: bash -c 'cd backend && .venv/bin/python -m pytest tests/test_database_migrations.py -q'
        language: system
        pass_filenames: false
        files: ^backend/(alembic/|app/db/|app/models/|tests/test_database_migrations\.py|tests/test_initialize_database\.py)
        stages: [pre-push]

      - id: backend-lockfiles
        name: backend lockfiles
        entry: ./scripts/check_backend_requirements.sh
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|requirements-dev\.in|requirements(\-dev)?(\-hashed)?\.txt)$
        stages: [pre-push]

      - id: backend-pip-audit
        name: backend pip audit
        entry: bash -c 'cd backend && .venv/bin/pip-audit -r requirements-hashed.txt --require-hashes'
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|requirements-dev\.in|requirements(\-dev)?(\-hashed)?\.txt)$
        stages: [pre-push]

      - id: frontend-lint
        name: frontend lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

      - id: frontend-typecheck
        name: frontend typecheck
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

      - id: frontend-lockfile
        name: frontend lockfile
        entry: bash -c 'cd frontend && npm run audit:lockfile'
        language: system
        pass_filenames: false
        files: ^frontend/(package\.json|package-lock\.json)$
        stages: [pre-push]

      - id: frontend-unused-deps
        name: frontend unused deps
        entry: bash -c 'cd frontend && npm run audit:unused'
        language: system
        pass_filenames: false
        files: ^frontend/
        stages: [pre-push]

      - id: frontend-npm-audit
        name: frontend npm audit
        entry: bash -c 'cd frontend && npm run audit:deps'
        language: system
        pass_filenames: false
        files: ^frontend/(package\.json|package-lock\.json)$
        stages: [pre-push]
