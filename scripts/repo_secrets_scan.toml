version = 1
max_scan_bytes = 1_000_000

ignored_path_prefixes = [
  ".git/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  "backend/.pytest_cache/",
  "backend/.ruff_cache/",
  "backend/.venv/",
  "backend/trading_platform_backend.egg-info/",
  "frontend/.next/",
  "frontend/node_modules/",
]

allowed_path_patterns = [
  "(^|/)\\.env\\.example$",
  "(^|/)\\.env\\.[^/]+\\.example$",
]

forbidden_path_patterns = [
  "(^|/)\\.env($|\\.)",
  "(^|/)[^/]+\\.local\\.(json|ya?ml|toml|ini)$",
  "(^|/)local\\.settings\\.json$",
  "(^|/).+\\.(db|sqlite|sqlite3)$",
  "(^|/).+\\.(db|sqlite|sqlite3)-(wal|shm)$",
  "(^|/)logs?/",
  "(^|/).+\\.(log|out|err)$",
  "(^|/)(broker|ig)[-_./].*(dump|payload|response|capture|session)",
  "(^|/).*(broker|ig).*(dump|payload|response|capture|session).*(\\.json|\\.txt|\\.log)$",
  "(^|/)(playwright-report|test-results|artifacts)/",
  "(^|/).+\\.(har|trace|trace\\.zip)$",
]

sensitive_env_keys = [
  "IG_API_KEY",
  "IG_USERNAME",
  "IG_PASSWORD",
  "IG_ACCOUNT_ID",
  "OPERATOR_API_TOKEN",
  "OPENAI_API_KEY",
  "API_KEY",
  "ACCESS_TOKEN",
  "REFRESH_TOKEN",
  "SECRET_KEY",
]

placeholder_value_patterns = [
  "^$",
  "^your[-_].+",
  "^example[-_].+",
  "^expected[-_].+",
  "^fake[-_].+",
  "^mock[-_].+",
  "^demo[-_].+",
  "^test[-_].+",
  "^placeholder[-_].*",
  "^replace[-_].*",
  "^redacted.*",
  "^\\[REDACTED.*\\]$",
]

broker_payload_marker_keys = [
  "accountId",
  "currentAccountId",
  "dealReference",
  "dealId",
  "positions",
  "affectedDeals",
  "epic",
]
