[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform-backend"
version = "0.1.0"
description = "Backend for a personal algorithmic trading platform."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlmodel>=0.0.24,<1.0.0",
  "sqlalchemy>=2.0.0,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "lightstreamer-client-lib>=2.2.2,<3.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
