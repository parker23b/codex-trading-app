<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="primaryGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(52 12) rotate(135) scale(40)">
      <stop stop-color="#39C5B6"/>
      <stop offset="1" stop-color="#39C5B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="secondaryGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(12 52) rotate(-45) scale(42)">
      <stop stop-color="#FFB086"/>
      <stop offset="1" stop-color="#FFB086" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#16304A"/>
      <stop offset="1" stop-color="#0C131A"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="6" y="6" width="52" height="52" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#base)"/>
    <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#primaryGlow)"/>
    <rect x="6" y="6" width="52" height="52" rx="16" fill="url(#secondaryGlow)"/>
  </g>

  <rect x="18" y="18" width="8" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.82"/>
  <rect x="28" y="18" width="8" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.82"/>
  <rect x="38" y="18" width="8" height="28" rx="4" fill="#FFFFFF" fill-opacity="0.82"/>
</svg>
